actions:
  - name: triggerWorkflowRun
    definition:
      handler: '{{NHOST_BACKEND_URL}}/v1/functions/api/trigger-workflow-run'
      forward_client_headers: true
      kind: synchronous
      type: mutation
    permissions:
      - role: user
  - name: approveStep
    definition:
      handler: '{{NHOST_BACKEND_URL}}/v1/functions/api/approve-step'
      forward_client_headers: true
      kind: synchronous
      type: mutation
    permissions:
      - role: user
  - name: saveWorkflow
    definition:
      handler: '{{NHOST_BACKEND_URL}}/v1/functions/api/save-workflow'
      forward_client_headers: true
      kind: synchronous
      type: mutation
    permissions:
      - role: user
custom_types:
  enums: []
  input_objects: []
  objects: []
  scalars: []
