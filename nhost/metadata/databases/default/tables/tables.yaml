- table:
    schema: public
    name: workflow_runs
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          column: workflow_run_id
          table:
            schema: public
            name: step_runs
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - workflow_id
          - triggered_by
          - trigger_type
          - status
          - started_at
          - completed_at
          - error
          - created_at
          - updated_at
        filter:
          workflow:
            organization:
              org_members:
                user_id:
                  _eq: X-Hasura-User-Id
        allow_aggregations: true

- table:
    schema: public
    name: step_runs
  object_relationships:
    - name: workflow_run
      using:
        foreign_key_constraint_on: workflow_run_id
    - name: step
      using:
        foreign_key_constraint_on: step_id
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - workflow_run_id
          - step_id
          - step_order
          - status
          - input
          - output
          - error
          - attempt_count
          - approved_by
          - approved_at
          - started_at
          - completed_at
          - created_at
          - updated_at
        filter:
          workflow_run:
            workflow:
              organization:
                org_members:
                  user_id:
                    _eq: X-Hasura-User-Id

- table:
    schema: public
    name: watched_table_events
  event_triggers:
    - name: on_watched_table_event
      definition:
        enable_manual: true
        insert:
          columns: '*'
      retry_conf:
        num_retries: 3
        interval_sec: 10
        timeout_sec: 60
      webhook: http://functions:3000/api/event-trigger
