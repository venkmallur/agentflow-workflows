- table:
    schema: public
    name: organizations
  computed_fields:
    - name: monthly_run_count
      definition:
        function:
          schema: public
          name: org_monthly_run_count
    - name: avg_run_duration
      definition:
        function:
          schema: public
          name: org_avg_run_duration_seconds
  array_relationships:
    - name: org_members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: org_members
    - name: workflows
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: workflows
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - name
          - slug
          - quota_limit
          - quota_used
          - quota_period_start
          - created_at
          - updated_at
        computed_fields:
          - monthly_run_count
          - avg_run_duration
        filter:
          org_members:
            user_id:
              _eq: X-Hasura-User-Id

- table:
    schema: public
    name: org_members
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - org_id
          - user_id
          - role
          - created_at
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        check:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
        columns:
          - org_id
          - user_id
          - role
  update_permissions:
    - role: user
      permission:
        check:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
        filter:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner
        columns:
          - role
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner

- table:
    schema: public
    name: workflows
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships:
    - name: steps
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_steps
    - name: triggers
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_triggers
    - name: runs
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_runs
  select_permissions:
    - role: user
      permission:
        columns:
          - id
          - org_id
          - name
          - description
          - status
          - created_by
          - created_at
          - updated_at
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
  insert_permissions:
    - role: user
      permission:
        check:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
        set:
          created_by: x-hasura-user-id
        columns:
          - name
          - description
          - org_id
          - status
  update_permissions:
    - role: user
      permission:
        check:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _in:
                      - owner
                      - editor
        filter:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
        columns:
          - name
          - description
          - status
  delete_permissions:
    - role: user
      permission:
        filter:
          organization:
            org_members:
              _and:
                - user_id:
                    _eq: X-Hasura-User-Id
                - role:
                    _eq: owner

